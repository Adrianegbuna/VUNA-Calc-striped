<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VUNA Calculator</title>
  <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <button class="btn btn-outline-secondary theme-toggle-btn" id="theme-toggle" onclick="toggleTheme()" title="Toggle dark/light mode">🌙</button>
  
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-6 col-sm-8">
        <div class="border border-dotted border-3 rounded-3 p-3 mb-4 bg-white bg-opacity-50">
          <h4 class="text-center group-header mb-0">VUNA CALCULATOR</h4>
          <p class="text-center text-small text-muted">
            <i>Created by set 2025/26 Software Engineering</i>
          </p>
        </div>
        
        <div class="row">
          <div class="col-md-12">
            <div class="card calculator-card">
              <div class="card-body p-4">
                <div class="calculator">
                  <!-- Display -->
                  <div class="display-container">
                    <input type="text" class="form-control" id="result" placeholder="0" disabled />
                  </div>

                  <!-- Calculator Keypad -->
                  <div class="btn-grid">
                    <button class="btn btn-light" onclick="appendToResult(7)">7</button>
                    <button class="btn btn-light" onclick="appendToResult(8)">8</button>
                    <button class="btn btn-light" onclick="appendToResult(9)">9</button>
                    <button class="btn btn-operator" onclick="operatorToResult('/')">÷</button>

                    <button class="btn btn-light" onclick="appendToResult(4)">4</button>
                    <button class="btn btn-light" onclick="appendToResult(5)">5</button>
                    <button class="btn btn-light" onclick="appendToResult(6)">6</button>
                    <button class="btn btn-operator" onclick="operatorToResult('*')">×</button>

                    <button class="btn btn-light" onclick="appendToResult(1)">1</button>
                    <button class="btn btn-light" onclick="appendToResult(2)">2</button>
                    <button class="btn btn-light" onclick="appendToResult(3)">3</button>
                    <button class="btn btn-operator" onclick="operatorToResult('+')">+</button>

                    <button class="btn btn-light" onclick="appendToResult('.')">.</button>
                    <button class="btn btn-light" onclick="appendToResult(0)">0</button>
                    <button class="btn btn-action" onclick="clearResult()">AC</button>
                    <button class="btn btn-operator" onclick="operatorToResult('-')">−</button>

                    <!-- Unit Converter Button -->
                    <button class="btn btn-special" onclick="toggleUnitConverter()" style="grid-column: span 2;">Unit Conv</button>
                    <button class="btn btn-equals" onclick="calculateResult()" style="grid-column: span 2;">=</button>
                  </div>

                  <!-- Unit Converter Panel (hidden by default) -->
                  <div id="unit-converter" style="display: none; margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 12px;">
                    <h6 class="text-center mb-3">Unit Converter</h6>
                    
                    <div class="mb-2">
                      <select class="form-select form-select-sm" id="conv-category" onchange="updateUnitOptions()">
                        <option value="mass">Mass</option>
                        <option value="area">Area</option>
                        <option value="data">Data Storage</option>
                      </select>
                    </div>

                    <div class="row g-2 mb-2">
                      <div class="col-5">
                        <input type="number" class="form-control" id="conv-value" placeholder="Value" step="any">
                      </div>
                      <div class="col-3">
                        <select class="form-select form-select-sm" id="conv-from"></select>
                      </div>
                      <div class="col-1 text-center pt-1">→</div>
                      <div class="col-3">
                        <select class="form-select form-select-sm" id="conv-to"></select>
                      </div>
                    </div>

                    <button class="btn btn-primary w-100" onclick="performUnitConversion()">Convert</button>
                    <div id="conv-result" class="text-center mt-2 fw-bold text-primary"></div>
                  </div>

                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/bootstrap.min.js"></script>
  <script src="src/calculator.js"></script>
  <script src="assets/js/script.js"></script>
</body>
</html>
